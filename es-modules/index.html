<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fitness Tracker - FA-006 Dynamic Render</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .stats-summary {
            text-align: center;
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        .workout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .workout-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-left: 6px solid #4CAF50;
            transition: transform 0.2s ease-in-out;
        }
        .workout-card:hover {
            transform: translateY(-5px);
        }
        .workout-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .workout-card p {
            margin: 6px 0;
            color: #555;
            font-size: 0.95rem;
        }
        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .controls-container {
            background: white; 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            display: flex;
            justify-content: space-between; 
            gap: 15px; 
            flex-wrap: wrap; 
            max-width: 1000px; 
            margin-left: auto; 
            margin-right: auto;
        }
        .searchBox {
            flex: 1;
            min-width: 200px; 
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px; 
            font-size: 1rem;
        }
        .slectBox {
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 1rem; 
            cursor: pointer;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4CAF50; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-box { text-align: center; padding: 30px; background: white; border-radius: 12px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .retry-btn { background-color: #f44336; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .retry-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>
    <h1 id="app-title">Fitness Tracker ES Modules Demo</h1>
    <!-- <div id="stats-summary" class="stats-summary">Loading stats...</div> -->
    <div class="controls-container">
        <input type="text" id="search-input" placeholder="Search exercises by name...">
        <div>
            <select class="slectBox" id="filter-select">
                <option value="All">All Muscles</option>
                <option value="Chest">Chest</option>
                <option value="Legs">Legs</option>
                <option value="Core">Core</option>
                <option value="Arms">Arms</option>
            </select>
            
            <select class="slectBox" id="sort-select">
                <option value="default">Sort By: Default</option>
                <option value="rating-high">Rating (High to Low)</option>
                <option value="duration-low">Duration (Low to High)</option>
            </select>
        </div>
    </div>
    <div id="status-container"></div>
    <div id="workout-container" class="workout-grid">
        <p>Loading exercises from API...</p>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
